<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Tracker | 架構重構版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
</head>
<body>

<!-- Toast 提示區 -->
<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1060;">
    <div id="liveToast" class="toast align-items-center border-0 text-white" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex"><div class="toast-body fw-bold fs-6 w-100 text-center" id="toast-body"></div></div>
    </div>
</div>

<!-- 動態確認彈窗 -->
<div class="modal fade" id="dynamicConfirmModal" tabindex="-1" aria-hidden="true" style="z-index: 1070;">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-body text-center p-4">
                <h5 class="fw-bold mb-3" id="dc-title">確認操作</h5>
                <p class="text-muted mb-4" id="dc-message" style="font-size: 0.95em;"></p>
                <div class="d-flex flex-column gap-2" id="dc-buttons"></div>
            </div>
        </div>
    </div>
</div>

<!-- 登入畫面 -->
<div id="login-screen">
    <h1 class="mb-3 fw-bold text-white">🧭 Life Tracker</h1>
    <p class="text-muted mb-5">PWA ✕ 模組化 ✕ 狀態管理</p>
    <button id="btn-login" class="btn btn-outline-light btn-lg px-4 rounded-pill shadow-sm">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="24" class="me-2"> Google 登入
    </button>
</div>

<!-- 主程式區塊 -->
<div id="main-app" class="container-fluid py-4" style="display: none; max-width: 1000px;">
    
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h3 class="fw-bold mb-0 d-flex align-items-center gap-2">
            🧭 儀表板 
            <select id="overview-range" class="form-select form-select-sm shadow-sm action-lock" style="width: auto; font-size: 0.9rem;">
                <option value="week" selected>本週</option>
                <option value="month">本月</option>
            </select>
        </h3>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary action-lock" data-bs-toggle="modal" data-bs-target="#settingsModal">⚙️ 設定</button>
            <button class="btn btn-sm fw-bold action-lock" style="background-color: var(--theme-purple); color: white;" data-bs-toggle="modal" data-bs-target="#reportModal" id="btn-generate-report">🏆 戰報</button>
            <button id="btn-logout" class="btn btn-sm btn-outline-secondary rounded-pill px-3 action-lock">登出</button>
        </div>
    </div>

    <!-- 景點與金句 Banner -->
    <div class="quote-container mb-4 action-lock" id="quote-card" title="👆 點擊隨機切換">
        <div class="quote-overlay"></div>
        <div class="quote-content-layer">
            <div class="quote-text" id="q-text">載入中...</div>
            <div class="quote-author" id="q-author"></div>
        </div>
    </div>

    <!-- 四格數據統計區 -->
    <div class="row g-3 mb-4 action-lock">
        <div class="col-6 col-md-3">
            <div class="card card-custom p-3 border-top border-warning border-3 h-100">
                <div class="text-muted small"><span class="range-label">區間</span>結餘</div>
                <h3 class="mt-2 mb-0 val-income" id="stat-saving">0</h3>
                <div class="small text-muted mt-1">支 <span id="stat-expense">0</span> / 收 <span id="stat-income">0</span></div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-custom p-3 border-top border-info border-3 h-100">
                <div class="text-muted small"><span class="range-label">區間</span>熱量赤字</div>
                <h3 class="mt-2 mb-0 val-exercise" id="stat-calorie">0</h3>
                <div class="small text-muted mt-1">攝 <span id="stat-food">0</span> / 耗 <span id="stat-burn">0</span></div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-custom p-3 border-top border-cyan border-3 h-100" style="border-top-color: var(--theme-cyan);">
                <div class="text-muted small"><span class="range-label">區間</span>自我成長</div>
                <h4 class="mt-2 mb-1 val-growth"><span id="stat-learning">0</span> <span class="fs-6 text-muted fw-normal">次微接觸</span></h4>
                <div class="small text-muted mt-1">習慣打卡：<span id="stat-habit" class="fw-bold text-white">0</span> 次</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card card-custom p-3 border-top border-success border-3 h-100 d-flex flex-column justify-content-center">
                <div class="text-muted small mb-1"><span class="range-label">區間</span>活躍度</div>
                <h2 class="mb-0 text-white fw-bold"><span id="stat-active-days">0</span> <span class="fs-5 text-muted fw-normal">/ <span id="stat-total-days">7</span> 天</span></h2>
                <div class="progress mt-2" style="height: 6px; background-color: var(--border-color);">
                    <div id="stat-active-bar" class="progress-bar bg-success" role="progressbar" style="width: 0%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 歷史紀錄與批次管理 -->
    <div class="card card-custom p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <ul class="nav nav-pills border-bottom border-secondary pb-2 mb-0 flex-grow-1" id="pills-tab" role="tablist">
                <li class="nav-item"><button class="nav-link active action-lock" data-bs-toggle="pill" data-bs-target="#content-growth" type="button">🌱 成長足跡</button></li>
                <li class="nav-item"><button class="nav-link action-lock" data-bs-toggle="pill" data-bs-target="#content-life" type="button">🌟 狀態足跡</button></li>
                <li class="nav-item"><button class="nav-link action-lock" data-bs-toggle="pill" data-bs-target="#content-finance" type="button">💳 財務足跡</button></li>
                <li class="nav-item"><button class="nav-link action-lock" data-bs-toggle="pill" data-bs-target="#content-health" type="button">💪 健康足跡</button></li>
            </ul>
            <button class="btn btn-sm btn-outline-danger ms-2" id="btn-toggle-manage">☑️ 批次管理</button>
        </div>

        <div id="manage-bar" class="d-none bg-danger p-2 rounded mb-2 d-flex justify-content-between align-items-center" style="--bs-bg-opacity: .15;">
            <span class="text-danger fw-bold small ms-2">🗑️ 批次刪除模式</span>
            <div>
                <button class="btn btn-sm btn-danger fw-bold shadow-sm" id="btn-batch-delete">刪除選取項目</button>
                <button class="btn btn-sm btn-secondary shadow-sm" id="btn-cancel-manage">退出</button>
            </div>
        </div>

        <div class="tab-content flex-grow-1">
            <div class="tab-pane fade show active h-100" id="content-growth">
                <div class="table-responsive tab-table-container"><table class="table table-dark-custom table-hover align-middle mb-0"><tbody id="table-growth-body"></tbody></table></div>
            </div>
            <div class="tab-pane fade h-100" id="content-life">
                <div class="table-responsive tab-table-container"><table class="table table-dark-custom table-hover align-middle mb-0"><tbody id="table-life-body"></tbody></table></div>
            </div>
            <div class="tab-pane fade h-100" id="content-finance">
                <div class="table-responsive tab-table-container"><table class="table table-dark-custom table-hover align-middle mb-0"><tbody id="table-finance-body"></tbody></table></div>
            </div>
            <div class="tab-pane fade h-100" id="content-health">
                <div class="table-responsive tab-table-container"><table class="table table-dark-custom table-hover align-middle mb-0"><tbody id="table-health-body"></tbody></table></div>
            </div>
        </div>
    </div>

    <!-- 長期軌跡熱力圖 -->
    <div class="card card-custom p-3 mt-4">
        <h6 class="fw-bold mb-2 text-muted">✨ 長期軌跡 (近一年)</h6>
        <div class="heatmap-container" id="heatmap-scroller">
            <div class="heatmap-grid" id="heatmap-grid"></div>
        </div>
    </div>

    <div class="fab-container action-lock">
        <button class="fab-btn" data-bs-toggle="modal" data-bs-target="#recordModal">＋</button>
    </div>
</div>

<!-- 輸入紀錄 Modal -->
<div class="modal fade" id="recordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold">✍️ 紀錄足跡</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="form-record">
                    <div class="mb-3"><input type="date" class="form-control" id="input-date" required></div>
                    <div class="mb-3">
                        <select class="form-select fw-bold" id="input-type" required>
                            <optgroup label="微成長 (低門檻)">
                                <option value="learning">📚 微學習/閱讀 (有做即打卡)</option>
                                <option value="habit">✅ 生活習慣 (有做即打卡)</option>
                            </optgroup>
                            <optgroup label="財務管理">
                                <option value="expense">💸 支出 (花費)</option>
                                <option value="income">💰 收入 (存錢/薪水)</option>
                            </optgroup>
                            <optgroup label="健康管理">
                                <option value="food">🍱 飲食 (攝取熱量)</option>
                                <option value="exercise">🏃 運動 (消耗熱量)</option>
                            </optgroup>
                            <optgroup label="狀態覺察">
                                <option value="sleep">💤 睡眠時間 (小時)</option>
                                <option value="mood">🌟 心情能量 (1~5)</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="mb-3"><select class="form-select" id="input-category"></select></div>
                    <div class="mb-3" id="amount-container">
                        <input type="number" step="0.1" min="0" max="9999999" class="form-control form-control-lg text-center fw-bold" id="input-amount" placeholder="數值" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" class="form-control" id="input-note" placeholder="備註細節 (選填)" maxlength="20">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2" style="background-color: var(--theme-blue); border:none;">💾 儲存紀錄</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- (此處略去系統設定與戰報的 Modal HTML，結構與上一版相同，保持版面清潔) -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
